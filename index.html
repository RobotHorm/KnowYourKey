<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowYourKey - Infinite Neon Rhythm</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #050505; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            image-rendering: pixelated; 
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        ctx.imageSmoothingEnabled = false;

        // --- ESTADOS DO JOGO ---
        let gameState = "MENU"; 

        // --- SISTEMA DINÂMICO DE TECLAS (3K a 6K) ---
        let numKeys = 4; // Começa com 4 por padrão
        
        const defaultKeys = {
            3: ["KeyA", "KeyS", "KeyD"],
            4: ["KeyD", "KeyF", "KeyJ", "KeyK"],
            5: ["KeyD", "KeyF", "Space", "KeyJ", "KeyK"],
            6: ["KeyS", "KeyD", "KeyF", "KeyJ", "KeyK", "KeyL"]
        };

        let keyCodes = [];
        let keyLabels = [];
        let keyMap = {};
        let keysPressed = [];
        let configStep = 0; 
        let hitGlow = []; 

        // --- CORES NEON (Até 6 pistas) ---
        const allColors = ["#ff0055", "#00ccff", "#00ff66", "#ffcc00", "#9b59b6", "#ff8800"];
        
        // --- VARIÁVEIS DE JOGO ---
        let notes = [];
        let score = 0;
        let combo = 0;
        let frame = 0;
        let health = 100;
        
        // --- DIFICULDADE INFINITA ---
        let currentLevel = 1; 
        let pointsInCurrentLevel = 0;
        let pointsToNextLevel = 1500; 
        let levelUpTimer = 0; 
        
        function calcularDificuldade(nivel) {
            return {
                speed: 4.2 + (nivel * 0.8), 
                spawnRate: Math.max(10, 55 - (nivel * 3) - (numKeys * 2)), 
                damage: Math.min(50, 8 + (nivel * 2)) 
            };
        }

        // --- GEOMETRIA DA TELA ---
        let buttonY = 0; 
        let lanes = [];
        let laneWidth = 90; 
        const raioBolinha = 32; 
        let hitMessage = "";
        let hitTimer = 0;

        function aplicarTeclasPadrao() {
            keyCodes = [...defaultKeys[numKeys]];
            keyLabels = keyCodes.map(formatarNomeTecla);
            keyMap = {};
            keyCodes.forEach((c, i) => keyMap[c] = i);
            keysPressed = new Array(numKeys).fill(false);
            hitGlow = new Array(numKeys).fill(0);
            redimensionarTela(); 
        }

        function redimensionarTela() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            buttonY = canvas.height - 120; 
            
            const centroX = canvas.width / 2;
            lanes = [];
            
            let larguraTotal = numKeys * laneWidth;
            let startX = centroX - (larguraTotal / 2) + (laneWidth / 2);
            
            for (let i = 0; i < numKeys; i++) {
                lanes.push(startX + (i * laneWidth));
            }
            ctx.imageSmoothingEnabled = false; 
        }
        
        window.addEventListener('resize', redimensionarTela);
        aplicarTeclasPadrao(); 

        // --- CONTROLES ---
        function formatarNomeTecla(code) {
            if (code === "Space") return "SPC";
            if (code.startsWith("Arrow")) return code.replace("Arrow", "").substring(0,3).toUpperCase();
            if (code.startsWith("Key")) return code.charAt(3);
            if (code.startsWith("Digit")) return code.charAt(5);
            if (code.startsWith("Numpad")) return code.charAt(6);
            return code.substring(0,3).toUpperCase();
        }

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") e.preventDefault(); 

            if (gameState === "MENU") {
                if (e.code === "ArrowUp") {
                    numKeys = Math.min(6, numKeys + 1);
                    aplicarTeclasPadrao();
                }
                if (e.code === "ArrowDown") {
                    numKeys = Math.max(3, numKeys - 1);
                    aplicarTeclasPadrao();
                }

                if (e.code === "Digit1" || e.code === "Numpad1") iniciarJogo(1);
                if (e.code === "Digit2" || e.code === "Numpad2") iniciarJogo(5);
                if (e.code === "Digit3" || e.code === "Numpad3") iniciarJogo(10);
                
                if (e.code === "KeyC") iniciarConfiguracao();
            } 
            else if (gameState === "CONFIG") {
                e.preventDefault();
                keyCodes[configStep] = e.code;
                keyLabels[configStep] = formatarNomeTecla(e.code);
                configStep++;
                
                if (configStep >= numKeys) {
                    keyMap = {};
                    keyCodes.forEach((c, i) => keyMap[c] = i);
                    gameState = "MENU";
                }
            }
            else if (gameState === "GAMEOVER") {
                if (e.code === "Space" || e.code === "Enter") gameState = "MENU";
            } 
            else if (gameState === "PLAYING") {
                let pista = keyMap[e.code];
                if (pista !== undefined && !keysPressed[pista]) { 
                    keysPressed[pista] = true; 
                    tentarAcerto(pista); 
                }
            }
        });

        document.addEventListener("keyup", (e) => {
            let pista = keyMap[e.code];
            if (pista !== undefined) keysPressed[pista] = false;
        });

        // --- LÓGICA DO JOGO ---
        function iniciarConfiguracao() {
            gameState = "CONFIG"; 
            configStep = 0;
            keyCodes = []; 
            keyLabels = new Array(numKeys).fill("-");
        }

        function iniciarJogo(nivelInicial) {
            score = 0; combo = 0; health = 100; notes = []; frame = 0;
            currentLevel = nivelInicial; 
            pointsInCurrentLevel = 0;
            levelUpTimer = 0; hitMessage = ""; 
            hitGlow = new Array(numKeys).fill(0);
            keysPressed = new Array(numKeys).fill(false);
            gameState = "PLAYING";
        }

        function tentarAcerto(laneIndex) {
            let noteIndex = notes.findIndex(n => n.lane === laneIndex && n.y > buttonY - (raioBolinha*2.5) && n.y < buttonY + (raioBolinha*2.5));
            
            if (noteIndex !== -1) {
                let note = notes[noteIndex];
                let diferenca = Math.abs(note.y - buttonY);
                let pontosGanhos = 0;

                if (diferenca < 20) { 
                    pontosGanhos = 50; health += 5; mostrarMensagem("PERFEITO!", "#fff");
                } else if (diferenca < 45) { 
                    pontosGanhos = 20; health += 2; mostrarMensagem("BOM!", "#ccc");
                } else { 
                    pontosGanhos = 5; combo = 0; mostrarMensagem("QUASE", "#e67e22");
                }
                
                score += pontosGanhos;
                pointsInCurrentLevel += pontosGanhos;
                if (pontosGanhos > 5) combo++;
                
                hitGlow[laneIndex] = 12; 

                if (health > 100) health = 100; 
                notes.splice(noteIndex, 1); 
                checarEvolucao();
            } else {
                combo = 0; health -= 5; 
                if (health <= 0) gameState = "GAMEOVER";
            }
        }

        function checarEvolucao() {
            if (pointsInCurrentLevel >= pointsToNextLevel) {
                pointsInCurrentLevel -= pointsToNextLevel;
                currentLevel++; 
                levelUpTimer = 120; 
            }
        }

        function mostrarMensagem(texto, cor) {
            hitMessage = { texto, cor }; hitTimer = 30;
        }

        function atualizar() {
            if (gameState !== "PLAYING") return;

            let dif = calcularDificuldade(currentLevel);
            let velocidadeAtual = dif.speed + ((pointsInCurrentLevel / pointsToNextLevel) * 0.8); 
            
            if (frame % dif.spawnRate === 0) {
                let randomLane = Math.floor(Math.random() * numKeys);
                notes.push({ lane: randomLane, y: -50 });
            }

            for (let i = 0; i < notes.length; i++) {
                notes[i].y += velocidadeAtual;
                
                if (notes[i].y > buttonY + 60) {
                    combo = 0;
                    health -= dif.damage;
                    mostrarMensagem("ERROU!", "#e74c3c");
                    notes.splice(i, 1);
                    i--;
                    
                    if (health <= 0) gameState = "GAMEOVER";
                }
            }
            
            for(let i=0; i < numKeys; i++) {
                if (hitGlow[i] > 0) hitGlow[i]--;
            }

            if (hitTimer > 0) hitTimer--;
            if (levelUpTimer > 0) levelUpTimer--;
            frame++;
        }

        // --- DESENHO NA TELA ---
        function desenhar() {
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "MENU") desenharMenu();
            else if (gameState === "CONFIG") desenharConfig();
            else if (gameState === "PLAYING") desenharJogo();
            else if (gameState === "GAMEOVER") desenharGameOver();
        }

        function desenharMenu() {
            ctx.fillStyle = "#fff"; ctx.textAlign = "center";
            ctx.font = "bold 60px Arial"; ctx.fillText("KnowYourKey", canvas.width / 2, canvas.height / 2 - 120);
            
            ctx.fillStyle = "#00ccff";
            ctx.font = "bold 26px Arial";
            ctx.fillText(`MODO: ${numKeys} TECLAS`, canvas.width / 2, canvas.height / 2 - 55);
            ctx.font = "15px Arial"; ctx.fillStyle = "#aaa";
            ctx.fillText("(Use SETA CIMA / BAIXO para alterar entre 3K e 6K)", canvas.width / 2, canvas.height / 2 - 30);

            ctx.font = "bold 22px Arial";
            ctx.fillStyle = "#2ecc71"; ctx.fillText("[ 1 ] INICIAR NÍVEL 1", canvas.width / 2, canvas.height / 2 + 25);
            ctx.fillStyle = "#f1c40f"; ctx.fillText("[ 2 ] INICIAR NÍVEL 5", canvas.width / 2, canvas.height / 2 + 65);
            ctx.fillStyle = "#e74c3c"; ctx.fillText("[ 3 ] INICIAR NÍVEL 10", canvas.width / 2, canvas.height / 2 + 105);
            
            ctx.fillStyle = "#555"; ctx.font = "15px Arial";
            ctx.fillText(`Aperte [ C ] para customizar. Atuais: ` + keyLabels.join(" | "), canvas.width / 2, canvas.height / 2 + 175);
        }

        function desenharConfig() {
            ctx.fillStyle = "#fff"; ctx.textAlign = "center";
            ctx.font = "bold 40px Arial"; ctx.fillText(`KnowYourKey - MODO ${numKeys}K`, canvas.width / 2, canvas.height / 2 - 100);
            ctx.font = "18px Arial"; ctx.fillStyle = "#aaa"; ctx.fillText("Aperte a tecla desejada para cada pista.", canvas.width / 2, canvas.height / 2 - 50);

            ctx.font = "bold 28px Arial"; ctx.fillStyle = allColors[configStep] || "#fff";
            ctx.fillText(`PISTA ${configStep + 1}...`, canvas.width / 2, canvas.height / 2 + 30);

            let preview = keyLabels.map((lbl, i) => i === configStep ? "[ ? ]" : lbl).join("   ");
            ctx.fillStyle = "#fff"; ctx.font = "bold 24px Arial"; ctx.fillText(preview, canvas.width / 2, canvas.height / 2 + 100);
        }

        function desenharGameOver() {
            ctx.fillStyle = "#e74c3c"; ctx.textAlign = "center";
            ctx.font = "bold 60px Arial"; ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 60);

            ctx.fillStyle = "#fff"; ctx.font = "26px Arial";
            ctx.fillText("KnowYourKey (" + numKeys + " Teclas)", canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillText("Você sobreviveu até o Nível: " + currentLevel, canvas.width / 2, canvas.height / 2 + 30);
            ctx.fillStyle = "#00ffcc"; ctx.fillText("Score Final: " + score, canvas.width / 2, canvas.height / 2 + 75);

            ctx.fillStyle = "#aaa"; ctx.font = "18px Arial"; ctx.fillText("Pressione ESPAÇO para Menu", canvas.width / 2, canvas.height / 2 + 130);
        }

        function desenharJogo() {
            let corBase = "rgba(255, 255, 255, 0.02)";
            if (levelUpTimer > 0) corBase = `rgba(255, 255, 255, ${levelUpTimer / 300})`;

            lanes.forEach((x, index) => {
                ctx.fillStyle = corBase;
                ctx.fillRect(x - laneWidth/2, 0, laneWidth, canvas.height);
                
                ctx.strokeStyle = allColors[index % allColors.length];
                ctx.globalAlpha = 0.15;
                ctx.beginPath();
                ctx.moveTo(x - laneWidth/2, 0); ctx.lineTo(x - laneWidth/2, canvas.height);
                ctx.moveTo(x + laneWidth/2, 0); ctx.lineTo(x + laneWidth/2, canvas.height);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            });

            // 1. ANÉIS ALVO
            lanes.forEach((x, index) => {
                let pressionado = keysPressed[index];
                let corDaPista = allColors[index % allColors.length];
                let hitPisca = hitGlow[index] > 0;
                
                ctx.beginPath(); 
                ctx.arc(x, buttonY, raioBolinha, 0, Math.PI * 2);
                
                if (hitPisca) {
                    ctx.fillStyle = "#ffffff"; ctx.fill();
                    ctx.shadowBlur = 20; ctx.shadowColor = corDaPista;
                } else if (pressionado) {
                    ctx.fillStyle = "rgba(255, 255, 255, 0.1)"; ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.shadowBlur = 0; 
                }
                
                ctx.strokeStyle = hitPisca ? "#fff" : corDaPista;
                ctx.lineWidth = hitPisca ? 6 : (pressionado ? 4 : 2); 
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = hitPisca ? "#000" : "rgba(255, 255, 255, 0.5)";
                ctx.font = keyLabels[index] === "SPC" ? "bold 12px Arial" : "bold 16px Arial"; 
                ctx.textAlign = "center";
                ctx.fillText(keyLabels[index], x, buttonY + 6); 
            });

            // 2. BOLINHAS CAINDO
            notes.forEach(note => {
                let cor = allColors[note.lane % allColors.length];
                
                ctx.fillStyle = cor;
                ctx.shadowBlur = 15; ctx.shadowColor = cor;
                ctx.beginPath(); 
                ctx.arc(lanes[note.lane], note.y, raioBolinha, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath();
                ctx.arc(lanes[note.lane] - 10, note.y - 10, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // HUD
            ctx.fillStyle = "#fff"; ctx.textAlign = "left";
            ctx.font = "bold 24px Arial"; ctx.fillText("SCORE: " + score, 20, 40);
            
            ctx.font = "bold 18px Arial";
            ctx.fillStyle = allColors[currentLevel % allColors.length]; 
            ctx.fillText(`NÍVEL: ${currentLevel} (${numKeys}K)`, 20, 70);

            if (combo > 4) {
                ctx.fillStyle = "#fff"; ctx.textAlign = "center";
                let tamanhoFonte = 60 + Math.sin(frame/5) * 5; 
                ctx.font = "bold " + tamanhoFonte + "px Arial"; 
                ctx.fillText(combo + "x", canvas.width / 2, canvas.height / 2 - 50);
            }

            if (hitTimer > 0 && hitMessage) {
                ctx.fillStyle = hitMessage.cor; ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
                ctx.fillText(hitMessage.texto, canvas.width / 2, buttonY - 90);
            }

            if (levelUpTimer > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${levelUpTimer / 120})`;
                ctx.font = "bold 70px Arial"; ctx.textAlign = "center";
                ctx.fillText("NÍVEL " + currentLevel + "!", canvas.width / 2, canvas.height / 3);
            }

            // Barra de Vida
            ctx.fillStyle = "#222"; ctx.fillRect(canvas.width - 220, 20, 200, 20); 
            if (health > 60) ctx.fillStyle = "#2ecc71"; else if (health > 30) ctx.fillStyle = "#f1c40f"; else ctx.fillStyle = "#e74c3c";
            ctx.fillRect(canvas.width - 220, 20, health * 2, 20); 
            ctx.strokeStyle = "#fff"; ctx.strokeRect(canvas.width - 220, 20, 200, 20); 
            ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.font = "bold 16px Arial"; ctx.fillText("ENERGY", canvas.width - 230, 36);
        }

        function loop() {
            atualizar(); desenhar(); requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
